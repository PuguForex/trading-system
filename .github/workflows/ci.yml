name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v5

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Python dependencies
        working-directory: apps/python-service
        run: uv sync

      - name: Load CI env
        run: cp .env.ci .env

      - name: Lint
        run: npm run lint

      - name: Security Audit
        run: npm audit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test
