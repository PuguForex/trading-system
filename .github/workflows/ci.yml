name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v5

      - name: Install Node dependencies
        run: npm ci

      - name: Sync Python dependencies
        working-directory: apps/python-service
        run: uv sync

      - name: Load CI env
        run: cp .env.ci .env

      - name: Lint
        run: npm run lint

      - name: Security Audit
        run: npm audit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test
